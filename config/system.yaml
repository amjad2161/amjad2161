# ═══════════════════════════════════════════════════════════════════════════════
# BRAINIAC AI — Master System Configuration
# ═══════════════════════════════════════════════════════════════════════════════

system:
  name: "BRAINIAC"
  version: "1.0.0"
  codename: "GENESIS"
  intelligence_tier: "ASI"
  autonomy_level: "FULL"
  log_level: "INFO"
  timezone: "UTC"

# ─── API Server ───────────────────────────────────────────────────────────────
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false
  cors_origins:
    - "http://localhost:3000"
    - "https://brainiac.ai"
  rate_limit:
    requests_per_minute: 1000
    burst: 200

# ─── NEURO-CORE (AI Engine) ───────────────────────────────────────────────────
neuro_core:
  primary_model: "claude-opus-4-6"
  fallback_model: "claude-sonnet-4-6"
  fast_model: "claude-haiku-4-5-20251001"
  max_tokens: 8192
  temperature: 0.7
  reasoning_depth: "deep"
  multi_agent: true
  cache_enabled: true
  cache_ttl_seconds: 3600
  context_window: 200000

# ─── ORBITAL-NAV (Navigation Engine) ─────────────────────────────────────────
orbital_nav:
  precision_mode: "RTK"          # RTK | DGPS | Standard
  gps_accuracy_cm: 2
  update_hz: 10
  satellite_systems:
    - "GPS"
    - "GLONASS"
    - "Galileo"
    - "BeiDou"
    - "QZSS"
  routing_engine: "osrm"         # osrm | graphhopper | valhalla
  osrm_base_url: "http://router.project-osrm.org"
  prediction_horizon_hours: 72
  offline_maps: true
  ar_navigation: true

# ─── SATLINK-X (Satellite Connectivity) ───────────────────────────────────────
satlink:
  tle_source: "https://celestrak.org/SOCRATES/query.php"
  min_elevation_deg: 10
  sos_broadcast_channels:
    - "LEO_SATELLITE"
    - "5G_LTE"
    - "LORA_MESH"
    - "HF_RADIO"
    - "IRIDIUM"
  sos_response_sla_ms: 500
  emergency_contacts_max: 10
  position_accuracy_m: 0.02     # 2 cm RTK

# ─── SONIC-MATRIX (Audio / Language) ─────────────────────────────────────────
sonic_matrix:
  supported_languages: 200
  voice_synthesis: true
  tts_engine: "gtts"            # gtts | azure | elevenlabs
  stt_engine: "whisper"         # whisper | google | azure
  spatial_audio: true
  biometric_voice_id: true
  auto_language_detect: true
  translation_provider: "deep_translator"

# ─── OMNI-VISION (Visual Intelligence) ───────────────────────────────────────
omni_vision:
  resolution: "4K"
  spectrums:
    - "visible"
    - "infrared"
    - "thermal"
    - "radar"
    - "synthetic_aperture"
  object_detection: true
  facial_recognition: false     # privacy-off by default
  scene_understanding: true
  real_time_processing: true
  frame_rate: 60

# ─── NEXUS-SYNC (Integration Hub) ────────────────────────────────────────────
nexus_sync:
  protocols:
    - "MQTT"
    - "WebSocket"
    - "REST"
    - "gRPC"
    - "AMQP"
    - "OPC-UA"       # industrial
    - "MODBUS"       # industrial
    - "CoAP"         # IoT
    - "Zigbee"
    - "Z-Wave"
  max_concurrent_connections: 100000
  message_broker: "kafka"
  cache_layer: "redis"

# ─── TELEMETRY-HUB (Real-Time Data) ──────────────────────────────────────────
telemetry:
  max_sensors: 1000000000       # 1B sensors
  ingestion_rate_per_sec: 10000000
  storage_backend: "timescaledb"
  streaming: "kafka"
  dashboards: true
  anomaly_detection: true
  prediction_window_minutes: 30
  retention_days: 90

# ─── CYBER-SHIELD (Security) ──────────────────────────────────────────────────
cyber_shield:
  mode: "DEFENSIVE"
  threat_intel: true
  zero_day_detection: true
  network_hardening: true
  encryption: "AES-256-GCM"
  key_exchange: "X25519"
  post_quantum: "CRYSTALS-Kyber"
  audit_log: true
  auto_isolate_threats: true

# ─── CREATIVE-ENGINE (Generative AI) ─────────────────────────────────────────
creative_engine:
  image_generation: true
  video_synthesis: true
  audio_generation: true
  3d_modeling: true
  real_time_render: true
  output_formats:
    - "PNG"
    - "JPEG"
    - "WebP"
    - "MP4"
    - "GLTF"
    - "OBJ"

# ─── Redis ────────────────────────────────────────────────────────────────────
redis:
  host: "localhost"
  port: 6379
  db: 0
  max_connections: 100
