# ═══════════════════════════════════════════════════════════════════════════════
# BRAINIAC AI — Docker Compose Stack
# ═══════════════════════════════════════════════════════════════════════════════

version: "3.9"

services:
  # ── BRAINIAC API Server ─────────────────────────────────────────────────────
  brainiac:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brainiac-core
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - BRAINIAC_SECRET=${BRAINIAC_SECRET:-change-me-in-production}
      - REDIS_HOST=redis
      - CORS_ORIGINS=http://localhost:3000,https://brainiac.ai
    depends_on:
      - redis
      - prometheus
    networks:
      - brainiac-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Redis (cache layer) ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: brainiac-redis
    restart: unless-stopped
    # Bound to localhost only in local-dev compose. For production, expose via
    # an internal service mesh or remove the published port entirely.
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - brainiac-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Prometheus (metrics) ─────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: brainiac-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - brainiac-net

  # ── Grafana (dashboards) ─────────────────────────────────────────────────────
  # GF_SECURITY_ADMIN_PASSWORD is REQUIRED — no default. Set it in .env or
  # the deployment environment. Compose will refuse to start if unset.
  grafana:
    image: grafana/grafana:latest
    container_name: brainiac-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set GF_SECURITY_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - brainiac-net
    depends_on:
      - prometheus

networks:
  brainiac-net:
    driver: bridge

volumes:
  grafana-data:
