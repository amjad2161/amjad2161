name: singularity-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core + dev + api)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,api]'

      - name: Lint (ruff)
        run: ruff check singularity tests

      - name: Type check (mypy, non-blocking)
        run: mypy singularity || true

      - name: Test (pytest)
        run: pytest -q

      - name: Smoke (offline kernel boots)
        run: |
          python -m singularity --mock status > /dev/null
          python -m singularity --mock demo > /dev/null
